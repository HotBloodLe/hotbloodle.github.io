<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小乐の个人网站</title>
    <link rel="icon" type="image/x-icon" href="https://avatars.githubusercontent.com/u/315612147?s=64&v=4">
    <style>
    body {
        background-image: url('/leaveallbehind.jpeg');
        opacity: 0.6;
    }
    </style>
    <style>
        /* ========== 全局重置 & 字体 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Segoe UI", "PingFang SC", Roboto, "Helvetica Neue", sans-serif;
            background: #f5f7fa;
        }

        /* ========== 顶栏外层 ========== */
        .top-main {
            background: #2c3e50;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 999;
        }
        .top-main .frame {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            flex-wrap: wrap;
        }
        /* 清除浮动（备用） */
        .clearfix::after {
            content: "";
            display: table;
            clear: both;
        }

        /* ========== Logo ========== */
        .logo {
            display: block;
            width: 120px;
            height: 40px;
            background: #ecf0f1;
            border-radius: 4px;
            text-indent: -9999px;
            /* 你可以用背景图代替： background: url('logo.png') no-repeat center/contain; */
            flex-shrink: 0;
        }
        /* 如果你没有图片，也可以直接显示文字 */
        .logo-text {
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 1px;
        }

        /* ========== 导航菜单 ========== */
        .navs {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .def-nav {
            color: #ecf0f1;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 15px;
            transition: background 0.2s, color 0.2s;
            display: inline-block;
            white-space: nowrap;
        }
        .def-nav:hover {
            background: rgba(255,255,255,0.15);
        }
        /* 当前页面高亮 */
        .def-nav.on {
            background: #1abc9c;
            color: #fff;
        }

        /* ========== 下拉菜单容器 ========== */
        .has-pulldown {
            position: relative;
        }
        .has-pulldown .pulldown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            min-width: 180px;
            background: #fff;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            border-radius: 6px;
            padding: 8px 0;
            margin-top: 4px;
            z-index: 1000;
        }
        .has-pulldown:hover .pulldown {
            display: block;
        }
        .pulldown a {
            display: block;
            padding: 8px 20px;
            color: #2c3e50;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.15s;
        }
        .pulldown a:hover {
            background: #f0f2f5;
        }
        /* 下拉箭头（小装饰） */
        .pull-arrow {
            display: inline-block;
            margin-left: 4px;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 5px solid #b0bec5;
            vertical-align: middle;
        }

        /* ========== 搜索框 ========== */
        .search_box {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }
        .search_box input[type="text"] {
            border: none;
            border-radius: 20px 0 0 20px;
            padding: 6px 16px;
            height: 34px;
            width: 200px;
            outline: none;
            font-size: 14px;
            background: #ecf0f1;
            transition: width 0.3s;
        }
        .search_box input[type="text"]:focus {
            width: 260px;
            background: #fff;
        }
        .search_box input[type="submit"] {
            border: none;
            border-radius: 0 20px 20px 0;
            padding: 6px 18px;
            height: 34px;
            background: #1abc9c;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .search_box input[type="submit"]:hover {
            background: #16a085;
        }

        /* ========== 右侧信息区（静态占位） ========== */
        .info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .info .user-placeholder {
            color: #ecf0f1;
            font-size: 14px;
        }
        .info .user-placeholder a {
            color: #1abc9c;
            text-decoration: none;
        }
        .info .user-placeholder a:hover {
            text-decoration: underline;
        }

        /* ========== 移动端适配 ========== */
        @media (max-width: 820px) {
            .top-main .frame {
                height: auto;
                padding: 10px 16px;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .navs {
                justify-content: center;
                gap: 4px;
            }
            .def-nav {
                padding: 6px 12px;
                font-size: 14px;
            }
            .search_box {
                order: 10;
                justify-content: center;
                margin-top: 4px;
            }
            .search_box input[type="text"] {
                width: 140px;
            }
            .search_box input[type="text"]:focus {
                width: 180px;
            }
            .info {
                justify-content: center;
            }
            .logo {
                align-self: center;
            }
            /* 下拉菜单在移动端可改为点击展开（这里保留hover，触屏设备长按可用） */
            .has-pulldown .pulldown {
                left: 50%;
                transform: translateX(-50%);
                min-width: 150px;
            }
        }
        @media (max-width: 480px) {
            .def-nav {
                font-size: 13px;
                padding: 4px 8px;
            }
            .search_box input[type="text"] {
                width: 100px;
            }
            .search_box input[type="text"]:focus {
                width: 140px;
            }
        }
    </style>
</head>
<body>

<!-- ==================== 顶栏开始 ==================== -->
<div class="top-main clearfix">
    <div class="frame">

        <!-- Logo（文字版，你也可以换成图片） -->
        <a href="/" class="logo-text">小乐个人站</a>

            <div class="def-nav has-pulldown">

        <div class="search_box">
            <form action="https://www.bing.com/search?mkt=zh-CN" method="get" target="_blank">

    <p style="color: #145777;">从顶栏得到更多信息！</p>
    <div align="center">
        <img src="https://raw.githubusercontent.com/HotBloodLe/hotbloodle.github.io/refs/heads/main/touchme.gif" width="15%" height="15%" alt="抚摸小乐">

<!-- ========== 自动高亮当前导航（JavaScript） ========== -->
<script>
    (function() {
        // 获取当前路径（去掉域名和查询参数）
        var currentPath = window.location.pathname;
        // 如果路径以 / 结尾，补上 index.html（便于匹配）
        if (currentPath.endsWith('/')) {
            currentPath += 'index.html';
        }
        // 获取所有导航链接（.def-nav 中不含下拉子项的真正的 a 标签）
        var navLinks = document.querySelectorAll('.navs > .def-nav, .navs > a.def-nav');
        // 但我们要排除包含下拉的容器（因为它的点击不是直接跳转）
        // 所以只处理直接子元素为 a 的链接
        var links = document.querySelectorAll('.navs > a.def-nav');

        links.forEach(function(link) {
            var href = link.getAttribute('href');
            if (!href) return;
            // 处理相对路径：去掉开头的 / 和结尾的 /
            var linkPath = href.split('?')[0].split('#')[0];
            // 如果链接是 '/'，特殊处理：只有当路径就是 '/' 或 '/index.html' 时匹配
            if (linkPath === '/') {
                if (currentPath === '/' || currentPath === '/index.html') {
                    link.classList.add('on');
                }
                return;
            }
            // 否则检查当前路径是否以 linkPath 开头（适用于子目录）
            // 但为了避免模糊匹配，我们检查是否完全相等或当前路径以 linkPath + '/' 开头
            if (currentPath === linkPath || currentPath.indexOf(linkPath + '/') === 0) {
                link.classList.add('on');
            }
        });

        // 在页面显示当前路径（仅供参考）
        var indicator = document.getElementById('page-indicator');
        if (indicator) {
            indicator.textContent = currentPath || '/';
        }
    })();
</script>

</body>
</html>
