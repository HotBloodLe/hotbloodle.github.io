<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小乐の个人网站</title>
    <style>
        /* ========== 全局重置 & 字体 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Segoe UI", "PingFang SC", Roboto, "Helvetica Neue", sans-serif;
            background: #f5f7fa;
        }

        /* ========== 顶栏外层 ========== */
        .top-main {
            background: #2c3e50;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 999;
        }
        .top-main .frame {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            flex-wrap: wrap;
        }
        /* 清除浮动（备用） */
        .clearfix::after {
            content: "";
            display: table;
            clear: both;
        }

        /* ========== Logo ========== */
        .logo {
            display: block;
            width: 120px;
            height: 40px;
            background: #ecf0f1;
            border-radius: 4px;
            text-indent: -9999px;
            /* 你可以用背景图代替： background: url('logo.png') no-repeat center/contain; */
            flex-shrink: 0;
        }
        /* 如果你没有图片，也可以直接显示文字 */
        .logo-text {
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 1px;
        }

        /* ========== 导航菜单 ========== */
        .navs {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .def-nav {
            color: #ecf0f1;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 15px;
            transition: background 0.2s, color 0.2s;
            display: inline-block;
            white-space: nowrap;
        }
        .def-nav:hover {
            background: rgba(255,255,255,0.15);
        }
        /* 当前页面高亮 */
        .def-nav.on {
            background: #1abc9c;
            color: #fff;
        }

        /* ========== 下拉菜单容器 ========== */
        .has-pulldown {
            position: relative;
        }
        .has-pulldown .pulldown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            min-width: 180px;
            background: #fff;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            border-radius: 6px;
            padding: 8px 0;
            margin-top: 4px;
            z-index: 1000;
        }
        .has-pulldown:hover .pulldown {
            display: block;
        }
        .pulldown a {
            display: block;
            padding: 8px 20px;
            color: #2c3e50;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.15s;
        }
        .pulldown a:hover {
            background: #f0f2f5;
        }
        /* 下拉箭头（小装饰） */
        .pull-arrow {
            display: inline-block;
            margin-left: 4px;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 5px solid #b0bec5;
            vertical-align: middle;
        }

        /* ========== 搜索框 ========== */
        .search_box {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }
        .search_box input[type="text"] {
            border: none;
            border-radius: 20px 0 0 20px;
            padding: 6px 16px;
            height: 34px;
            width: 200px;
            outline: none;
            font-size: 14px;
            background: #ecf0f1;
            transition: width 0.3s;
        }
        .search_box input[type="text"]:focus {
            width: 260px;
            background: #fff;
        }
        .search_box input[type="submit"] {
            border: none;
            border-radius: 0 20px 20px 0;
            padding: 6px 18px;
            height: 34px;
            background: #1abc9c;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .search_box input[type="submit"]:hover {
            background: #16a085;
        }

        /* ========== 右侧信息区（静态占位） ========== */
        .info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .info .user-placeholder {
            color: #ecf0f1;
            font-size: 14px;
        }
        .info .user-placeholder a {
            color: #1abc9c;
            text-decoration: none;
        }
        .info .user-placeholder a:hover {
            text-decoration: underline;
        }

        /* ========== 移动端适配 ========== */
        @media (max-width: 820px) {
            .top-main .frame {
                height: auto;
                padding: 10px 16px;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .navs {
                justify-content: center;
                gap: 4px;
            }
            .def-nav {
                padding: 6px 12px;
                font-size: 14px;
            }
            .search_box {
                order: 10;
                justify-content: center;
                margin-top: 4px;
            }
            .search_box input[type="text"] {
                width: 140px;
            }
            .search_box input[type="text"]:focus {
                width: 180px;
            }
            .info {
                justify-content: center;
            }
            .logo {
                align-self: center;
            }
            /* 下拉菜单在移动端可改为点击展开（这里保留hover，触屏设备长按可用） */
            .has-pulldown .pulldown {
                left: 50%;
                transform: translateX(-50%);
                min-width: 150px;
            }
        }
        @media (max-width: 480px) {
            .def-nav {
                font-size: 13px;
                padding: 4px 8px;
            }
            .search_box input[type="text"] {
                width: 100px;
            }
            .search_box input[type="text"]:focus {
                width: 140px;
            }
        }
    </style>
</head>
<body>

<!-- ==================== 顶栏开始 ==================== -->
<div class="top-main clearfix">
    <div class="frame">

        <!-- Logo（文字版，你也可以换成图片） -->
        <a href="/" class="logo-text">乐站</a>

        <!-- 导航菜单 -->
        <div class="navs">
            <a href="/" class="def-nav">主页</a>
            <a href="/le_blog/" class="def-nav">博客</a>

            <!-- 带下拉的示例菜单 -->
            <div class="def-nav has-pulldown">
                <span style="color:inherit; cursor:default;">关于<span class="pull-arrow"></span></span>
                <div class="pulldown">
                    <a href="/about/">关于我</a>
                    <a href="/history/">大事记</a>
                    <a href="/exlink/">友情链接</a>
                </div>
            </div>

            <a href="https://github.com" class="def-nav" target="_blank">GitHub</a>
        </div>

        <!-- 搜索框（提交到bing，小乐我啊，自己改过了 -->
        <div class="search_box">
            <form action="https://www.bing.com/search?mkt=zh-CN" method="get" target="_blank">
                <input type="text" name="q" placeholder="使用必应搜索..." maxlength="30">
                <input type="submit" value="搜索">
            </form>
        </div>

    </div>
</div>
<!-- ==================== 顶栏结束 ==================== -->
